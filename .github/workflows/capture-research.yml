name: KD3B Capture Research

on:
  push:
    branches:
      - assistant/phase2-capture-tool
    paths:
      - .github/workflows/capture-research.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download public OpenRGB issue captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures reports
          base='https://gitlab.com/CalcProgrammer1/OpenRGB/-/uploads'
          while read -r hash filename; do
            echo "Downloading ${filename}"
            curl --fail --location --retry 4 --retry-delay 2 \
              "${base}/${hash}/${filename}" \
              --output "captures/${filename}"
          done <<'EOF'
          b506fc715aa1b396c6e4fe8d5e1b6882 KD3Brev.2_ReportDescriptor.pcapng
          9546918bdf1f7856bbbe84fa83b7526e RED.pcapng
          c18288941db8153880846f249506697f GREEN.pcapng
          a33c0543db2f616555b32dd77e52f739 BLUE.pcapng
          4647f96efbab6fb1a71490529554e002 OFF.pcapng
          938ee6bcb4d5360860b56bb92d9f89ba WAVE.pcapng
          ad6de23e54909f06f66f45c1b0a72b4a ConicBand.pcapng
          a6887a16fd0a8c42dcea68f265bbff25 Spiral.pcapng
          0659c8660ac44704ad17d08fa56a3461 Cycle.pcapng
          da4cdf4b6eb048cb373c50d8ce9da4b4 LinearWave.pcapng
          04ff33aafa5c8f574184010defbb0199 Ripple.pcapng
          3bfa2ce26f3ce3726bf452bbaedc74dd Breathing.pcapng
          17530203343cb6b5218121bb4d7bc04a Rain.pcapng
          44b9d4001d892e3281ac6f11feef6048 Fire.pcapng
          45ee4807ec0ecc124b004fd4b07c8a3f Trigger.pcapng
          c8b47fbae59feb568c1541f006e147ae Brightness0-100.pcapng
          EOF
          sha256sum captures/*.pcapng | sort > reports/sha256.txt

      - name: Parse captures
        shell: bash
        run: |
          set -euo pipefail
          for capture in captures/*.pcapng; do
            name="$(basename "${capture}" .pcapng)"
            cargo run --quiet -p kd3b-capture -- list "${capture}" > "reports/${name}.list.txt"
            cargo run --quiet -p kd3b-capture -- extract "${capture}" > "reports/${name}.extract.txt"
          done

      - name: Generate focused protocol diffs
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -p kd3b-capture -- diff captures/RED.pcapng captures/GREEN.pcapng > reports/diff-RED-GREEN.txt
          cargo run --quiet -p kd3b-capture -- diff captures/RED.pcapng captures/BLUE.pcapng > reports/diff-RED-BLUE.txt
          cargo run --quiet -p kd3b-capture -- diff captures/OFF.pcapng captures/RED.pcapng > reports/diff-OFF-RED.txt
          for effect in WAVE ConicBand Spiral Cycle LinearWave Ripple Breathing Rain Fire Trigger; do
            cargo run --quiet -p kd3b-capture -- diff captures/OFF.pcapng "captures/${effect}.pcapng" > "reports/diff-OFF-${effect}.txt"
          done

      - name: Summarize reports in job log
        shell: bash
        run: |
          set -euo pipefail
          echo '===== SHA256 ====='
          cat reports/sha256.txt
          echo
          echo '===== ENDPOINT-3 OUT COUNTS ====='
          for report in reports/*.extract.txt; do
            printf '%-40s ' "$(basename "${report}")"
            grep '^endpoint-3 OUT payloads:' "${report}"
          done
          echo
          echo '===== OFF -> EFFECT DIFF HEADERS ====='
          grep -H '^payload #' reports/diff-OFF-*.txt || true

      - name: Upload protocol research reports
        uses: actions/upload-artifact@v4
        with:
          name: kd3b-openrgb-capture-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
