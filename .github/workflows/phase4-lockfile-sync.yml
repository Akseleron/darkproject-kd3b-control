name: Phase 4 lockfile sync

on:
  push:
    branches:
      - assistant/phase4-desktop

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: assistant/phase4-desktop

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate workspace lockfile
        run: cargo generate-lockfile

      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: lock desktop dependencies"
          git push origin HEAD:assistant/phase4-desktop
